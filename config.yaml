system:
  log_level: INFO
  data_dir: ./data
  photo_dir: ./data/photos
  report_dir: ./data/reports
  timezone: Asia/Shanghai
  mock_hardware: false   # 在非树莓派环境下用模拟实现，部署到 Pi 时改为 false

# 4 路浇水通道：每一路连接一个继电器驱动的 12V 水泵
# pin 使用 BCM 编号
channels:
  - id: 1
    name: 热带植物
    pin: 17
    bucket: 桶A
    flow_ml_per_sec: 18      # 实测水泵流量
    default_volume_ml: 800   # 单次默认浇水量
    schedule_cron: "0 7 * * *"   # 每天 7:00
  - id: 2
    name: 多肉植物
    pin: 27
    bucket: 桶B
    flow_ml_per_sec: 18
    default_volume_ml: 120
    schedule_cron: "0 8 */7 * *"   # 每 7 天 8:00
  - id: 3
    name: 中生植物
    pin: 22
    bucket: 桶C
    flow_ml_per_sec: 18
    default_volume_ml: 500
    schedule_cron: "0 7 */2 * *"   # 每 2 天 7:00
  - id: 4
    name: 水生植物
    pin: 23
    bucket: 桶D
    flow_ml_per_sec: 18
    default_volume_ml: 1500      # 用于补水，保持水位
    schedule_cron: "0 9 */3 * *"   # 每 3 天 9:00

safety:
  max_single_run_sec: 180        # 单次最长运行 3 分钟，防止干转
  cooldown_sec: 30               # 同一通道两次启动之间的冷却时间
  global_lock: true              # 同一时刻只允许一路水泵运行

camera:
  resolution: [1920, 1080]
  warmup_sec: 2

ai:
  provider: anthropic
  model: claude-opus-4-7
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 1500
  prompt: |
    你是一名资深园艺师。请基于这张花园照片，分析画面中可见盆栽的整体生长状况，
    分别从下列维度给出图文报告：
      1. 整体观感与构图
      2. 叶色 / 形态异常（黄叶、徒长、虫害、缺水、烂根迹象）
      3. 浇水建议（结合热带 / 多肉 / 中生 / 水生 4 类）
      4. 下一步养护 TODO 清单
    使用 Markdown，简洁分点，并在结尾给出 1-5 分的综合健康评分。

dingtalk:
  # 自定义机器人，用于主动推送（图片 / 报告 / 状态）
  webhook_env: DINGTALK_WEBHOOK
  secret_env: DINGTALK_SECRET
  # Stream 模式接收 @机器人 消息（无需公网回调）
  client_id_env: DINGTALK_CLIENT_ID
  client_secret_env: DINGTALK_CLIENT_SECRET
  # 仅允许下列 userId / unionId 下发浇花指令
  allowed_users: []

web:
  host: 0.0.0.0
  port: 8080
