system:
  log_level: INFO
  data_dir: ./data
  photo_dir: ./data/photos
  report_dir: ./data/reports
  timezone: Asia/Shanghai
  # true  = 纯模拟（PC/Mac 本地开发、跑测试）；GPIO / 相机都不碰硬件
  # false = 使用真实硬件（树莓派）。此时相机或 GPIO 不可用会**直接报错**，不会静默降级
  mock_hardware: false

# 4 路浇水通道：每一路连接一个继电器驱动的 12V 电磁阀
# pin 使用 BCM 编号，继电器高电平触发
channels:
  - id: 1
    name: 热带植物
    pin: 17
    bucket: 桶A
    default_duration_sec: 60   # 单次默认开阀时长(秒)；冬季降频后单次给足量
    schedule_cron: "0 7 * * sun"   # 每周日 7:00（APScheduler 中 0=周一，故用 sun 而非 0）
  - id: 2
    name: 多肉植物
    pin: 27
    bucket: 桶B
    default_duration_sec: 7
    schedule_cron: "0 8 */7 * *"   # 每 7 天 8:00
  - id: 3
    name: 中生植物
    pin: 22
    bucket: 桶C
    default_duration_sec: 28
    schedule_cron: "0 7 */2 * *"   # 每 2 天 7:00
  - id: 4
    name: 水生植物
    pin: 23
    bucket: 桶D
    default_duration_sec: 83      # 用于补水，保持水位
    schedule_cron: "0 9 */3 * *"   # 每 3 天 9:00

safety:
  max_single_run_sec: 180        # 单次最长运行 3 分钟，防止干转
  cooldown_sec: 30               # 同一通道两次启动之间的冷却时间
  global_lock: true              # 同一时刻只允许一路电磁阀运行
  # 仅当"没有 GPIO 也要跑通全流程"时才设为 true。
  # false（推荐）：GPIO 后端不可用时抛 HardwareError，避免"浇水成功"实际没开阀。
  allow_mock_fallback: false

camera:
  # IMX708(Pi Camera v3) 的原生模式是 4608x2592 / 2304x1296 / 1536x864。
  # 2304x1296 = 全视野 2:1 binning，ISP 无需缩放，画质最好（16:9，与原 1080p 同视角）。
  # 原先的 1920x1080 不在原生列表里，要 ISP 重采样，画面会偏软。
  resolution: [2304, 1296]
  warmup_sec: 2
  # 仅当"没有相机也要跑通全流程"时才设为 true。
  # false（推荐）：picamera2 不可用时抛出 CameraError，杜绝误把占位图当真实照片。
  allow_mock_fallback: false

  # ---- 对焦（"拍照模糊"的首要修复点）----
  # IMX708 是 VCM 自动对焦模组，libcamera 不会在拍照瞬间自动对焦，必须显式触发。
  # auto = 拍照前跑一次单次对焦循环（静止花架首选）
  # continuous = 持续对焦（适合移动目标；但 Picamera2 在该模式下不允许 autofocus_cycle）
  # manual = 固定焦距，配合 lens_position（屈光度：0=无穷远，1=1m，10=10cm）
  # 注意：L3 顶端俯角 30°，到 L3 植物约 0.3~0.5m、到 L1 约 1.5~2m，
  #       f/1.8 景深有限 —— 只能保证一个平面清晰，详见 docs/camera_image_quality.md
  autofocus: auto
  af_range: normal          # normal | macro（主拍 <30cm 近景时改 macro）
  af_wait_sec: 6            # continuous 模式下等待对焦收敛的上限
  lens_position: null       # 仅 autofocus=manual 时生效

  # ---- 曝光（防"运动模糊/拖影"）----
  # IMX708 最长曝光可达 ~1.7s，清晨/傍晚光线不足时 AEC 会拉得很长，
  # 有风时叶片就会拖影。限制帧时长上限 = 限制最长曝光。
  max_exposure_us: 66666    # 1/15s
  exposure_mode: auto       # auto | short（优先短曝光，抗拖影）| long
  sharpness_boost: 1.5      # ISP 锐化（默认 1.0）
  jpeg_quality: 95
  settle_frames: 2          # 拍照前丢弃的帧数，让 AE/AWB 收敛

  # ---- 画质门禁：成片低于阈值时在日志/状态里显式告警，绝不沉默 ----
  # 阈值为经验下限（基于本地标定：清晰 ~100，模糊半径 1.6px ~28，半径 4px ~2）。
  # 绝对值与拍摄场景强相关，建议在树莓派上拍一张正常照片后据实调整。
  quality_guard:
    enabled: true
    min_sharpness: 8.0
    min_contrast: 12.0

ai:
  provider: anthropic
  model: claude-opus-4-7
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 1500
  prompt: |
    你是一名资深园艺师。请基于这张花园照片，分析画面中可见盆栽的整体生长状况，
    分别从下列维度给出图文报告：
      1. 整体观感与构图
      2. 叶色 / 形态异常（黄叶、徒长、虫害、缺水、烂根迹象）
      3. 浇水建议（结合热带 / 多肉 / 中生 / 水生 4 类）
      4. 下一步养护 TODO 清单
    使用 Markdown，简洁分点，并在结尾给出 1-5 分的综合健康评分。

dingtalk:
  # 自定义机器人，用于主动推送（图片 / 报告 / 状态）
  webhook_env: DINGTALK_WEBHOOK
  secret_env: DINGTALK_SECRET
  # Stream 模式接收 @机器人 消息（无需公网回调）
  client_id_env: DINGTALK_CLIENT_ID
  client_secret_env: DINGTALK_CLIENT_SECRET
  # 仅允许下列 userId / unionId 下发浇花指令
  allowed_users: []

web:
  host: 0.0.0.0
  port: 8080
