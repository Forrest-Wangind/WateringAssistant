# 浇花助理配置文件
# 修改本文件后重启服务生效

# ========== 浇水通道 ==========
# 4 路继电器，BCM 编号
# active_low: 多数继电器板低电平触发，置 true；如继电器为高电平触发改为 false
channels:
  - id: 1
    name: 阳台月季
    gpio_pin: 17
  - id: 2
    name: 客厅绿萝
    gpio_pin: 27
  - id: 3
    name: 卧室多肉
    gpio_pin: 22
  - id: 4
    name: 厨房香草
    gpio_pin: 23

relay:
  active_low: true
  # 单次浇水时长上限（秒），防止程序异常导致持续放水
  max_duration_seconds: 600
  # 默认手动浇水时长（秒）
  default_duration_seconds: 30

# ========== 定时浇水任务 ==========
# 每条任务一行 cron 表达式（分 时 日 月 周），与 APScheduler 一致
# duration_seconds 为该次浇水时长
schedules:
  - name: 早晨浇花
    cron: "0 7 * * *"
    channel_id: 1
    duration_seconds: 60
  - name: 傍晚补水
    cron: "0 19 * * *"
    channel_id: 2
    duration_seconds: 45

# ========== 每日图文报告 ==========
report:
  enabled: true
  # 报告生成时间（24h cron）
  cron_list:
    - "0 8 * * *"
    - "0 18 * * *"
  # 拍照分辨率
  image_width: 1280
  image_height: 720
  # 接收报告的钉钉用户 ID（在 .env 的 DINGTALK_RECIPIENT_USER_IDS 中维护，留空则用此处）
  recipient_user_ids: []

# ========== 视觉模型 ==========
vision:
  provider: dashscope
  model: qwen-vl-max
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # 单次分析超时（秒）
  timeout: 60

# ========== 数据存储 ==========
storage:
  photo_dir: data/photos
  report_dir: data/reports
  # 仅保留最近 N 天照片，0 表示不清理
  keep_days: 30
